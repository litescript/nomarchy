# Installed as /etc/systemd/sleep.conf.d/10-nomarchy.conf by `nomarchy install host`.
# systemd-sleep reads it at every sleep, so it needs no reload.
#
# The suspend-then-hibernate half of the lid (see ./logind-nomarchy.conf): a lid closed for a
# few minutes resumes instantly, as before; a lid closed in a bag overnight hibernates after
# two hours and stops draining the battery. If that hibernate fails, systemd-sleep goes back
# to suspend ("Couldn't hibernate, will try to suspend again").
#
# One thing that loses a hibernated session: an image resumes only on the kernel that wrote
# it, and the kernel refuses any other. So after a `pacman -Syu` that upgrades `linux`,
# REBOOT before closing the lid for long -- otherwise the resume boots the new kernel, the
# image is discarded, and the session is gone as if the power had been cut. Booting the LTS
# entry while an image is waiting does the same.
[Sleep]
HibernateDelaySec=2h
# On AC the countdown does not run: closed at the desk, it just stays suspended. Unplugged
# while asleep, the two hours start then. (HibernateOnACPower= needs systemd >= 257.)
HibernateOnACPower=no
