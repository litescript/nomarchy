# Installed as /etc/systemd/logind.conf.d/10-nomarchy.conf by `nomarchy install host`, which
# then RELOADS logind (Type=notify-reload: SIGHUP, re-read in place). Reload, never restart --
# restarting logind would end the session. Check what logind actually loaded with
#   busctl get-property org.freedesktop.login1 /org/freedesktop/login1 \
#     org.freedesktop.login1.Manager HandleLidSwitch HandlePowerKey
#
# rigel is a laptop: its power button and lid put it away. caesar's file does the opposite
# (power key ignored, every sleep target masked) because caesar is always on.
#
# THE LID DECISION (open from 2026-09-13 to 2026-10-04): logind owns the lid, Noctalia owns
# the lock. Noctalia's lock_before_suspend (on by default) holds a logind delay inhibitor,
# WHY "Lock before sleep", and locks on PrepareForSleep -- the journal showed it locking on a
# bare lid close (2026-10-03 10:26, no keypress), as docs/new-host/rigel-open-questions.md §2
# predicted. So umbriel's [events] lid hooks stay commented: one owner, never two.
#
# Hibernation resumes through systemd's HibernateLocation EFI variable, so there is no
# resume= on the kernel command line and nothing to keep in step with the swapfile's offset.
[Login]
# Lid: suspend at once; hibernate after HibernateDelaySec on battery (../systemd/
# sleep-nomarchy.conf). "sleep" walks SleepOperation= in order and takes the first operation
# the machine can do right now -- so when swap cannot hold the active memory (8G swapfile,
# 16G RAM: logind's Active(anon) check), the lid falls back to a plain suspend, which is
# what it did before this file existed. Needs systemd >= 256.
HandleLidSwitch=sleep
SleepOperation=suspend-then-hibernate suspend
# Power button: hibernate. Shutdown stays in Noctalia's session panel. If hibernation is not
# possible logind uses a regular suspend instead ("Requested hibernate operation is not
# supported, using regular suspend instead").
HandlePowerKey=hibernate
