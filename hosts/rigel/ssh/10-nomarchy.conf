# rigel sshd policy.  ->  /etc/ssh/sshd_config.d/10-nomarchy.conf
#
# rigel takes ssh from the LAN so caesar can reach it whenever it is on (decided 2026-11-14;
# the firewall half is ../ufw/apply-rules). Until then it ran no sshd at all.
#
# Keys only. Stock Arch ships no PasswordAuthentication setting and OpenSSH's own default is
# `yes`. That matters more here than on caesar: a laptop roams, other networks use
# 192.168.1.0/24 too, and there the firewall rule admits their machines as well. The key
# requirement is what holds then.
#
# Validate with `sudo sshd -t` and apply with `sudo systemctl reload sshd` -- reload, not
# restart, so existing sessions survive.

PasswordAuthentication no
PermitRootLogin no
