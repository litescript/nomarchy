# Installed as /boot/loader/entries/arch-lts.conf by `nomarchy install host`. rigel's fallback
# kernel: there is no fallback initramfs (PRESETS=('default')), so if a mainline update or
# its NVIDIA DKMS build breaks boot, this entry is the way back in without a USB stick.
# systemd-boot does not generate Type #1 entries, so without this file the linux-lts package
# is a kernel nothing can boot. Written by hand on 2026-10-04, declared the same day.
#
# Deliberately no `quiet splash`: a recovery boot should show what it is doing.
# Not for routine use while hibernated -- an image resumes only on the kernel that wrote it.
title        Arch Linux (LTS)
linux        /vmlinuz-linux-lts
initrd       /intel-ucode.img
initrd       /initramfs-linux-lts.img
options      rd.luks.name=2057043b-d69f-423d-8b5c-a49ddadfe50a=cryptroot root=/dev/mapper/cryptroot rootflags=subvol=@ rw vt.global_cursor_default=0
