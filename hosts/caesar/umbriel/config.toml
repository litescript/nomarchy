# caesar — host configuration for umbriel.
#
# This is the main config file, symlinked to ~/.config/umbriel/config.toml. It carries
# only what is true of THIS machine: its three outputs. Everything else -- keybinds,
# input, appearance, layout, rules, animation -- lives in the shared base below and is
# identical on every nomarchy host.
#
# Applied in order: required includes, then optional includes, then this file. This file
# therefore wins any conflict, which is what makes it the place for host overrides.
#
# The base include is REQUIRED, deliberately. A missing optional include validates as
# `config: ok` and silently applies nothing -- a machine would come up with no keybinds
# at all and report a clean config. A missing required include fails loudly.
#
# The path is ~/ rather than relative because include paths resolve from the directory of
# the file as umbriel was given it, and that is ~/.config/umbriel (a symlink), not this
# directory. Verified, not assumed.
#
# Noctalia's generated palette (noctalia.toml) is the OPTIONAL include below, and that entry
# is not ours: it is where Noctalia's umbriel template puts it. Its post_hook --
# /usr/share/noctalia/assets/templates/umbriel/apply.sh -- rewrites THIS file on every theme
# change, with cp (so the edit lands in the repo instead of detaching the symlink), and only
# when the result differs. Noctalia 5.2.0 changed where it puts the entry: 5.0.x appended it
# to the REQUIRED [include]; 5.2.0 removes it from there ("written by older Noctalia
# versions") and keeps it as the last entry of [include.optional]. The layout below is 5.2.0's
# fixed point, byte for byte -- verified by running 5.2.0's own hook over it, which changes
# nothing. The first cutover rehearsal on 5.2.0 found the old layout rewritten on the new
# system, leaving nomarchy's checkout dirty (2026-09-28).
#
# Never name the palette in BOTH sections: umbriel logs "include cycle or duplicate skipped"
# and reports `configuration invalid`, which blocks umbriel-update's gate. A 5.0.x hook run
# against this file would do exactly that (it adds the entry to [include]); 5.2.0's hook
# repairs it, since it strips the entry from [include].
#
# Optional costs one property: a missing palette validates `config: ok` and applies no
# colours, where a required one failed loudly. common/bootstrap/seeds still plants the
# palette before first login, so a fresh machine has colours from the start.

[include]
files = ["~/Projects/nomarchy/common/umbriel/base.toml"]

[include.optional]
files = ["noctalia.toml"]

# ─────────────────────────────── Outputs ────────────────────────────────────
# Configure monitor identity, mode, logical placement, scaling, HDR, VRR, and
# workspace inventory. Run `umbriel outputs` to list names and available modes.
# Documentation: https://docs.noctalia.dev/umbriel/outputs/
# ────────────────────────────────────────────────────────────────────────────

# Output sections are machine-specific, so this example stays commented.
# Uncomment the complete block below and replace DP-1 with the correct name.
# Use a connector when the rule belongs to a port. To follow one physical
# display between machines or ports, replace the header with its quoted Config
# name, for example [output."Some Make Some Model ABC123"].

# [output.DP-1]
# enabled = true                                # False removes the output but preserves its state
# mode = "2560x1440@144"                        # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ
# position = [0, 0]                             # Logical top-left; omit for automatic placement
# scale = 1.25                                  # Logical size is mode size divided by scale
# transform = "normal"                          # normal, 90, 180, 270, or a flipped variant
# vrr = "fullscreen"                            # disabled, always, or fullscreen
# tearing = true                                # Permit eligible fullscreen asynchronous flips
# direct_scanout = true                         # False forces composition on this output
# hdr = "auto"                                  # off, on, auto, or fullscreen
# sdr_white = 203                               # SDR reference white in cd/m2 during HDR
# workspaces = 5                                # Anonymous fixed positions; omit for dynamic
# workspace_axis = "horizontal"                 # vertical or horizontal workspace arrangement
[output.HDMI-A-2]
enabled = true
mode = "1920x1080@60"
position = [320, 0]
scale = 1

[output.DP-2]
enabled = true
mode = "3840x2160@160"
position = [0, 1080]
scale = 1.5

[output.DP-3]
enabled = true
mode = "1920x1080@60"
position = [-1920, 1080]
scale = 1

# Replace the count with ["WEB", "CHAT", "MEDIA"] for named static workspaces,
# or with "dynamic" to state the dynamic default explicitly. A dynamic output
# can keep a minimum number of workspaces instead, so a bar always shows them:
# [output.DP-1]
# min_workspaces = 3                            # Dynamic floor; rejected with a static inventory

# New scrolling columns on this output can use a different initial extent. This
# affects new columns only; existing columns keep their current size.
# Documentation: https://docs.noctalia.dev/umbriel/outputs/#initial-scrolling-width
# [output.DP-1.layout.scrolling]
# default_extent_fraction = 0.4

