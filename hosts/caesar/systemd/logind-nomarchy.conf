# Installed as /etc/systemd/logind.conf.d/10-nomarchy.conf. Takes effect at the next boot:
# restarting logind to apply it would end the running session.
#
# caesar is a desktop that is always on -- Proxmox's netconsole lands here, the NAS backups
# run from here at night, and NUT is what powers it down. A bumped power button should not
# do it instead. Carried from the old install, which also masked every sleep target; that
# half lives in hosts/caesar/bootstrap/system-units.
[Login]
HandlePowerKey=ignore
