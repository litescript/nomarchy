# Installed as /etc/systemd/zram-generator.conf (package zram-generator).
#
# caesar had NO swap at all after the migration -- 61 GiB of RAM, but nothing to soften an
# OOM. The old install ran exactly this: one zram device with the generator's defaults
# (half of RAM capped at 4 GiB, zstd). Compressed RAM, not disk, so it costs nothing until
# it is used. Takes effect at boot, or: systemctl daemon-reload && systemctl start
# systemd-zram-setup@zram0.service
[zram0]
