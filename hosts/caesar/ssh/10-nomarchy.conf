# Caesar sshd policy.  ->  /etc/ssh/sshd_config.d/10-nomarchy.conf
#
# Stock Arch ships no PasswordAuthentication setting, and OpenSSH's own default is `yes`
# (confirmed in this box's sshd_config(5)). So before this file, caesar accepted password
# logins on 0.0.0.0:22 with no firewall in front of it.
#
# peter authenticates with keys and has no inbound ssh use today -- ~/.ssh/authorized_keys
# does not exist -- so `no` costs nothing and closes the general case. meanpete is a
# Windows/WSL user who does use a password, and only him; the Match block below is that
# exception, kept as narrow as it can be.
#
# The real mitigation is not here, though: meanpete holds no sudo grant at all on this box
# (audit section 11), so a compromised password is a compromised staging account, not root.
#
# Validate with `sudo sshd -t` and apply with `sudo systemctl reload sshd` -- reload, not
# restart, so existing sessions survive.

PasswordAuthentication no
PermitRootLogin no

Match User meanpete
    PasswordAuthentication yes

# Return to global scope. Defensive, and deliberately so. sshd_config(5) says a Match
# block applies "until either another Match line or the end of the file", but does not say
# whether that means this included file or the parent -- and /etc/ssh/sshd_config carries
# its `Include` on line one, so if scope does leak, that file's own AuthorizedKeysFile and
# Subsystem lines would be evaluated inside the meanpete match. Match all costs nothing
# and removes the question.
#
# Settle it on this box with, as root:
#   sshd -T | grep -E 'passwordauthentication|authorizedkeysfile|subsystem'
#   sshd -T -C user=meanpete,host=localhost,addr=127.0.0.1 | grep passwordauthentication
# The first must show `passwordauthentication no` and an intact AuthorizedKeysFile and
# Subsystem; the second must show `yes`.
Match all
