# /etc/snapper/configs/root -- installed by `nomarchy install storage` from
# hosts/caesar/storage/snapper-root.conf.
#
# Snapshots of @ (/) land in /.snapshots, which is the TOP-LEVEL subvolume @snapshots
# (./layout), not a subvolume nested inside @ as `snapper create-config` would make and
# Omarchy had: rolling @ back must not take @'s own snapshots with it. So this file is
# declared, not generated.
#
# Recovery, not bootable snapshots (decided 2026-09-27): systemd-boot has no snapshot menu,
# and caesar keeps a complete second OS, the SATA install, to recover from if it will not
# boot. The procedure, tested by tests/snapper-recovery, is in docs/cutover/.

SUBVOLUME="/"
FSTYPE="btrfs"
QGROUP=""
SPACE_LIMIT="0.5"
FREE_LIMIT="0.2"

# peter (wheel) may list and compare snapshots without sudo -- `nomarchy status` reads them.
ALLOW_USERS=""
ALLOW_GROUPS="wheel"
SYNC_ACL="yes"

BACKGROUND_COMPARISON="yes"

# snap-pac's pre/post pairs
NUMBER_CLEANUP="yes"
NUMBER_MIN_AGE="1800"
NUMBER_LIMIT="20"
NUMBER_LIMIT_IMPORTANT="10"

TIMELINE_CREATE="yes"
TIMELINE_CLEANUP="yes"
TIMELINE_MIN_AGE="1800"
TIMELINE_LIMIT_HOURLY="6"
TIMELINE_LIMIT_DAILY="7"
TIMELINE_LIMIT_WEEKLY="4"
TIMELINE_LIMIT_MONTHLY="2"
TIMELINE_LIMIT_QUARTERLY="0"
TIMELINE_LIMIT_YEARLY="0"

EMPTY_PRE_POST_CLEANUP="yes"
EMPTY_PRE_POST_MIN_AGE="1800"
