# kitty — ported deliberately from the Omarchy-era config, not wholesale.
# Classification of every original line lives in docs/migration/06-post-install-audit.md.

# ─────────────────────────── Universal clipboard ────────────────────────────
# Super+C / Super+V are handled by common/scripts/universal-clipboard, which
# injects Ctrl+Insert / Shift+Insert when the focused window is a terminal.
# Those chords must be pointed at the CLIPBOARD here, because kitty's defaults
# do not do what the mechanism needs:
#
#   ctrl+insert   unbound by default
#   shift+insert  paste_from_selection  -> pastes PRIMARY, not the clipboard
#
# Omarchy carried the same two lines in kitty, ghostty, alacritty and foot.
# Without them the compositor half is a silent no-op in a terminal.

map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# ──────────────────────────────── Font ──────────────────────────────────────
# 9.0 was chosen against a 3840x2160 panel at scale 1.5. That panel is now
# DP-2 at the same scale, so the rendered size is unchanged.
font_size 9.0

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# ─────────────────────────────── Window ─────────────────────────────────────
# Window decoration is deliberately absent: Umbriel sets prefer_no_csd = true
# and draws a border itself, so the old `hide_window_decorations yes` is now
# the compositor's business.
# window_padding_width takes CSS-style edges; one value covers all four sides,
# which is why the old config's separate `window_padding_height` was redundant.
window_padding_width 14
confirm_os_window_close 0

# ───────────────────────────── Keybindings ──────────────────────────────────
map F11 toggle_fullscreen

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# kitty's legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send
# CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# ────────────────────────────── Aesthetics ──────────────────────────────────
cursor_shape block
enable_audio_bell no
# no-cursor stops shell integration from overriding cursor_shape above.
shell_integration no-cursor
# 0 disables hiding entirely, matching [input.cursor] hide_timeout_ms = 0 in
# the Umbriel config.
mouse_hide_wait 0

# ────────────────────────────── Tab bar ─────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# ───────────────────────────── Not ported ───────────────────────────────────
# mouse_selection_from_gutter yes
#   Not a stock kitty option. It comes from the local fork that still exists at
#   ~/.local/opt/kitty-pete on the old disk. Enabling it under kitty 0.48.2
#   from [extra] produces a config error on every launch. Rebuild the fork, or
#   let the behaviour go.
#
# single_instance yes
#   Was grouped with `listen_on` to serve omarchy-launch-terminal's cwd lookup.
#   That caller is gone. It still buys fast window spawn, at the cost of every
#   terminal sharing one process. Left off pending a decision.
#
# window_padding_height 14
#   Never a stock kitty option. window_padding_width already covers all edges.
#
# show_window_resize_notification no
#   The option no longer exists; kitty dropped the resize notification upstream,
#   so "no" is simply the current behaviour.
#
# include ~/.local/state/omarchy/current/theme/kitty.conf
#   Omarchy theme pipeline. Noctalia's template system can regenerate an
#   equivalent when the theme runner is ported.
#
# listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
#   Omarchy-specific, and already inert with allow_remote_control commented out.
include themes/noctalia.conf
