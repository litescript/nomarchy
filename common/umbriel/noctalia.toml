# Noctalia's generated umbriel palette -- a SEED, not a tracked config file.
#
# Noctalia owns this file at runtime: its umbriel template rewrites it on every theme
# change, so the copy here is a snapshot and is EXPECTED to fall behind. It is not diffed
# by the bootstrap, which is why it lives in common/bootstrap/seeds rather than a copies
# manifest -- reporting its drift would be reporting that Noctalia is working.
#
# It exists so a freshly rebuilt machine has colours before Noctalia's template has run
# once. Noctalia 5.2.0 includes this file OPTIONALLY (its hook keeps "noctalia.toml" in
# [include.optional] -- see hosts/<host>/umbriel/config.toml), so a missing palette no
# longer fails validation; it silently applies no colours. Under Noctalia 5.0.x the include
# was REQUIRED and a missing file was `configuration invalid`. Either way the seed means a
# new host comes up in Tokyo Night rather than in a race with the shell.
#
# To change the theme, change it in Noctalia and let it regenerate. Do not hand-edit.

[colors]
background = "#24283bFF"
text_primary = "#c0caf5FF"
text_muted = "#9aa5ceFF"
accent_primary = "#7aa2f7FF"
accent_secondary = "#bb9af7FF"
warning = "#9ece6aFF"
error = "#f7768eFF"
insert_hint = "#9ece6a80"
backdrop = "#24283bFF"

[colors.border]
focused = "#7aa2f7FF"
unfocused = "#24283bFF"
outer = "#1a1b26FF"

[colors.overview]
background_tint = "#1a1b2688"

# Scratchpad borders are a window rule since umbriel f227e20; [colors.border] no longer
# accepts scratchpad_focused/unfocused. Mirrors Noctalia's own template fix, caaad47
# (in noctalia v5.2.0). A fresh host gets the newest umbriel from AUR, so the seed speaks
# its vocabulary -- the older form fails `umbriel config validate` there.
[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#9ece6aFF"
border_color_unfocused = "#44691cFF"
