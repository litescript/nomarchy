# fuzzel  ->  ~/.config/fuzzel/fuzzel.conf
#
# Exists for one job today: the SSH_ASKPASS prompt (common/scripts/askpass-fuzzel).
#
# This file owns layout only. Colour is Noctalia's job -- see the include at the bottom.
#
# Font matches kitty's, one size larger because this is a single transient line rather
# than a wall of text.
#
# Width is in CHARACTERS, and that matters more than it looks. ssh asks with the full key
# path, so the prompt alone runs to ~55 characters; any window narrower than the prompt
# leaves no room for the input field, which then renders off the right edge. The effect is
# a prompt that appears completely inert while you type -- the masked input exists, just
# past the edge of the window. askpass-fuzzel shortens the prompt for that reason, and
# this width is the other half of the fix.

font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
prompt=
lines=0
width=50
horizontal-pad=18
vertical-pad=14
inner-pad=6
layer=overlay

[border]
width=2
radius=10

# Colours come from Noctalia, regenerated on every theme change by its community "Fuzzel"
# template (enabled in settings.toml community_ids). This include is LAST on purpose:
# fuzzel applies directives in order, and an included file carries its own section scope,
# so whatever is read last wins. Anything that must survive a theme change goes above it.
include=~/.config/fuzzel/themes/noctalia
