# fuzzel  ->  ~/.config/fuzzel/fuzzel.conf
#
# Exists for one job today: the SSH_ASKPASS prompt (common/scripts/askpass-fuzzel).
# Unconfigured fuzzel renders its own default palette, which against this desktop looked
# wrong and -- worse -- made the masked input unreadable, so typing produced no visible
# feedback at all. The asterisks were there; they just had no contrast.
#
# Colours are lifted from Noctalia's own generated kitty palette
# (~/.config/kitty/themes/noctalia.conf, Tokyo-Night) so the prompt matches the terminal.
# Font matches kitty's too, one size larger because this is a single transient line rather
# than a wall of text.
#
# These are a static snapshot. Noctalia ships a community "Fuzzel" template that would
# regenerate them on every theme change; it is not enabled, and its output lands at
# ~/.config/fuzzel/themes/noctalia. To hand colour control over to Noctalia: enable Fuzzel
# under its theme templates, run `noctalia msg templates-apply`, then uncomment the include
# at the bottom of this file and drop the [colors] block. The include must come last --
# fuzzel applies directives in order, so whatever is read last wins.

font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
prompt=
lines=0
width=34
horizontal-pad=18
vertical-pad=14
inner-pad=6
layer=overlay

[colors]
background=1a1b26f0
text=c0caf5ff
prompt=7aa2f7ff
input=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=10

# Hand colours to Noctalia instead of the block above -- see the header.
# include=~/.config/fuzzel/themes/noctalia
