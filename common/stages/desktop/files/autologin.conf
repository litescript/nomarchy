# Installed by `nomarchy install desktop` as
# /etc/systemd/system/getty@tty1.service.d/autologin.conf.
#
# LOAD-BEARING, not a convenience. tty1 autologin -> ~/.bash_profile -> `exec start-umbriel`
# is how ~/.local/bin reaches the compositor's PATH, and every script keybind in
# common/umbriel/base.toml is a bare name resolved through that PATH. A session started any
# other way -- a display manager, notably -- leaves those binds registering, validating and
# doing nothing. Do not install a display manager.
#
# The user is `peter` on every host; the umbriel include path ~/Projects/nomarchy/... relies
# on that too. Was a root step on rigel and missing from caesar's entirely until 2026-09-27.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --autologin peter --noclear %I $TERM
