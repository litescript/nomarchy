# Installed by `nomarchy install base` as /etc/xdg/reflector/reflector.conf -- read by
# reflector.service (and so by reflector.timer, weekly). Decided 2026-09-28: US mirrors,
# HTTPS only, the 20 most recently synced, ranked by measured download rate. The
# mirrorlist this writes is generated state: never copied from another install.
--save /etc/pacman.d/mirrorlist
--country US
--protocol https
--latest 20
--sort rate
