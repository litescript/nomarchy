# Installed by `nomarchy install base` as /etc/security/faillock.conf.
#
# Chosen 2026-09-27, not inherited: stock pam_faillock locks an account for ten minutes
# after THREE failed passwords, which on a personal workstation mostly punishes typos --
# and sudo counts. Ten is what the old install used and what Pete picked on purpose.
# unlock_time stays at the default 600 s.
deny = 10
