# All SysRq functions. Installed by `nomarchy install base` as /etc/sysctl.d/99-sysrq.conf.
#
# Arch's default is 16 (sync only). This is a homelab owner's workstation: when a GPU hang
# or a storage stall wedges the session, Alt+SysRq+REISUB is the difference between a clean
# reboot and a hard power-off. Carried from the old Omarchy /etc on purpose, not by habit.
kernel.sysrq = 1
