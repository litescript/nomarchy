#? Config file for btop v. 1.4.7

# Use the terminal's background instead of painting the theme's own.
# kitty draws 14px of padding in its own (noctalia-themed) background colour;
# with theme_background = True, btop fills the interior pure black and the
# padding reads as a mismatched frame. Inheriting the terminal background makes
# the two agree, and keeps agreeing when the noctalia palette changes.
theme_background = False

# Truecolor, since kitty supports it.
truecolor = True

# Round to the terminal's own corners rather than drawing boxes at the edge.
rounded_corners = True
color_theme = "noctalia"
